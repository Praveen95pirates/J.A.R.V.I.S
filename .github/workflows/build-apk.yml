name: Build J.A.R.V.I.S. Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Debug APK
        run: |
          ls -la /github/workspace
          cd /github/workspace/android
          pwd
          ls -la
          buildozer android debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: |
            /github/workspace/android/bin/*.apk
          retention-days: 30
          compression-level: 9

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-logs
          path: /github/workspace/android/.buildozer/logs/
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          python -m pytest tests/ -v || echo "No tests yet"

      - name: Verify trading skills
        run: |
          python -c "from skills.trading_skills import handle_request; print('Trading backend OK')"
          python -c "from skills.complete_skills_library import create_complete_skills_library; r=create_complete_skills_library(); print('Skills:', len(r.list_enabled()))"
