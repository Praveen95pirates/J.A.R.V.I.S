<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. - Just A Rather Very Intelligent System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e0e6ed;
            height: 100vh;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Header */
        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(100, 200, 255, 0.2);
        }
        
        .header h1 {
            font-size: 2.5em;
            color: #64c8ff;
            text-shadow: 0 0 20px rgba(100, 200, 255, 0.5);
            letter-spacing: 3px;
            margin-bottom: 5px;
        }
        
        .header .subtitle {
            color: #8fa3b8;
            font-size: 0.9em;
        }
        
        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 0.9em;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* Chat Area */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            margin-bottom: 15px;
        }
        
        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 15px;
            max-width: 80%;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
            margin-left: auto;
            border-bottom-right-radius: 5px;
        }
        
        .message.jarvis {
            background: rgba(100, 200, 255, 0.1);
            border: 1px solid rgba(100, 200, 255, 0.3);
            margin-right: auto;
            border-bottom-left-radius: 5px;
        }
        
        .message .sender {
            font-size: 0.75em;
            opacity: 0.7;
            margin-bottom: 5px;
            font-weight: 600;
        }
        
        .message .text {
            line-height: 1.5;
            word-wrap: break-word;
        }
        
        .message .emotion {
            font-size: 0.75em;
            opacity: 0.6;
            margin-top: 5px;
            font-style: italic;
        }
        
        .message.system {
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.3);
            text-align: center;
            max-width: 100%;
            font-style: italic;
        }
        
        /* Input Area */
        .input-container {
            display: flex;
            gap: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
        }
        
        .input-container input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid rgba(100, 200, 255, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #e0e6ed;
            font-size: 1em;
            outline: none;
        }
        
        .input-container input:focus {
            border-color: #64c8ff;
            box-shadow: 0 0 10px rgba(100, 200, 255, 0.3);
        }
        
        .button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #64c8ff 0%, #3b82f6 100%);
            color: white;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(100, 200, 255, 0.4);
        }
        
        .button:active {
            transform: translateY(0);
        }
        
        .button.voice {
            background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
            min-width: 60px;
        }
        
        .button.voice.listening {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            animation: pulse 1s infinite;
        }
        
        /* Quick Actions */
        .quick-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .quick-action {
            padding: 8px 14px;
            background: rgba(100, 200, 255, 0.1);
            border: 1px solid rgba(100, 200, 255, 0.3);
            border-radius: 20px;
            color: #64c8ff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }
        
        .quick-action:hover {
            background: rgba(100, 200, 255, 0.2);
            transform: translateY(-2px);
        }
        
        /* Scrollbar */
        .chat-container::-webkit-scrollbar {
            width: 6px;
        }
        
        .chat-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }
        
        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(100, 200, 255, 0.3);
            border-radius: 3px;
        }
        
        /* Mobile responsiveness */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
            
            .message {
                max-width: 90%;
            }
            
            .quick-actions {
                overflow-x: auto;
                flex-wrap: nowrap;
            }
            
            .quick-action {
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>J.A.R.V.I.S.</h1>
            <div class="subtitle">Just A Rather Very Intelligent System</div>
        </div>
        
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-item">
                <div class="status-indicator"></div>
                <span id="statusText">Online</span>
            </div>
            <div class="status-item">
                <span id="moodText">Mood: neutral</span>
            </div>
            <div class="status-item">
                <span id="skillsCount">Skills: 0</span>
            </div>
        </div>
        
        <!-- Chat Area -->
        <div class="chat-container" id="chatContainer">
            <div class="message system">
                <div class="text">Initializing J.A.R.V.I.S. systems... Welcome!</div>
            </div>
        </div>
        
        <!-- Quick Actions -->
        <div class="quick-actions">
            <button class="quick-action" onclick="quickCommand('help')">📋 Help</button>
            <button class="quick-action" onclick="quickCommand('status')">📊 Status</button>
            <button class="quick-action" onclick="quickCommand('skills')">⚙️ Skills</button>
            <button class="quick-action" onclick="quickCommand('mood')">😊 Mood</button>
            <button class="quick-action" onclick="quickCommand('personality')">🎭 Personality</button>
            <button class="quick-action" onclick="clearChat()">🗑️ Clear</button>
        </div>
        
        <!-- Input Area -->
        <div class="input-container">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Message J.A.R.V.I.S..." 
                autocomplete="off"
                onkeypress="handleKeyPress(event)"
            >
            <button class="button voice" id="voiceButton" onclick="toggleVoice()">🎤</button>
            <button class="button" onclick="sendMessage()">Send</button>
        </div>
    </div>
    
    <script>
        // Configuration
        const API_BASE = window.location.origin;
        let voiceMode = false;
        let recognition = null;
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadStatus();
            loadHistory();
            setupVoiceRecognition();
        });
        
        // Send message
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // Add user message to chat
            addMessage('user', message);
            input.value = '';
            
            // Show typing indicator
            showTyping();
            
            try {
                const response = await fetch(`${API_BASE}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                
                const data = await response.json();
                removeTyping();
                addMessage('jarvis', data.response, data.emotion, data.intensity);
                
                // Update status
                updateMood(data.emotion, data.intensity);
            } catch (error) {
                removeTyping();
                addMessage('system', 'Error: Could not connect to J.A.R.V.I.S.');
            }
        }
        
        // Add message to chat
        function addMessage(sender, text, emotion = null, intensity = null) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            let emotionHtml = '';
            if (emotion && intensity) {
                emotionHtml = `<div class="emotion">Expressing ${emotion} (${(intensity * 100).toFixed(0)}%)</div>`;
            }
            
            messageDiv.innerHTML = `
                <div class="sender">${sender === 'user' ? 'You' : 'J.A.R.V.I.S.'}</div>
                <div class="text">${text}</div>
                ${emotionHtml}
            `;
            
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        // Show typing indicator
        function showTyping() {
            const chatContainer = document.getElementById('chatContainer');
            const typingDiv = document.createElement('div');
            typingDiv.id = 'typingIndicator';
            typingDiv.className = 'message jarvis';
            typingDiv.innerHTML = '<div class="text">Thinking...</div>';
            chatContainer.appendChild(typingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        // Remove typing indicator
        function removeTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }
        
        // Quick commands
        async function quickCommand(command) {
            addMessage('user', command);
            showTyping();
            
            try {
                const response = await fetch(`${API_BASE}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: command })
                });
                
                const data = await response.json();
                removeTyping();
                addMessage('jarvis', data.response);
            } catch (error) {
                removeTyping();
                addMessage('system', 'Error executing command');
            }
        }
        
        // Clear chat
        async function clearChat() {
            document.getElementById('chatContainer').innerHTML = '';
            addMessage('system', 'Chat cleared. How can I help you?');
        }
        
        // Handle enter key
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        
        // Load status
        async function loadStatus() {
            try {
                const response = await fetch(`${API_BASE}/api/status`);
                const data = await response.json();
                document.getElementById('skillsCount').textContent = `Skills: ${data.skills_count}`;
            } catch (error) {
                console.error('Failed to load status');
            }
        }
        
        // Load chat history
        async function loadHistory() {
            try {
                const response = await fetch(`${API_BASE}/api/history`);
                const history = await response.json();
                
                history.forEach(msg => {
                    addMessage('user', msg.user);
                    addMessage('jarvis', msg.jarvis, msg.emotion, msg.intensity);
                });
            } catch (error) {
                console.error('Failed to load history');
            }
        }
        
        // Update mood display
        function updateMood(emotion, intensity) {
            document.getElementById('moodText').textContent = `Mood: ${emotion}`;
        }
        
        // Voice mode
        function toggleVoice() {
            const button = document.getElementById('voiceButton');
            
            if (!voiceMode) {
                voiceMode = true;
                button.classList.add('listening');
                button.textContent = '🔴';
                
                if (recognition) {
                    recognition.start();
                }
            } else {
                voiceMode = false;
                button.classList.remove('listening');
                button.textContent = '🎤';
                
                if (recognition) {
                    recognition.stop();
                }
            }
        }
        
        // Setup voice recognition
        function setupVoiceRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = false;
                recognition.lang = 'en-US';
                
                recognition.onresult = async (event) => {
                    const transcript = event.results[event.results.length - 1][0].transcript;
                    addMessage('user', transcript);
                    
                    // Send to J.A.R.V.I.S.
                    showTyping();
                    try {
                        const response = await fetch(`${API_BASE}/api/chat`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ message: transcript })
                        });
                        
                        const data = await response.json();
                        removeTyping();
                        addMessage('jarvis', data.response, data.emotion, data.intensity);
                    } catch (error) {
                        removeTyping();
                        addMessage('system', 'Error processing voice input');
                    }
                };
                
                recognition.onerror = (event) => {
                    console.error('Speech recognition error:', event.error);
                    if (voiceMode) {
                        // Restart recognition
                        setTimeout(() => {
                            if (voiceMode && recognition) {
                                recognition.start();
                            }
                        }, 1000);
                    }
                };
                
                recognition.onend = () => {
                    // Restart if voice mode is still active
                    if (voiceMode) {
                        setTimeout(() => {
                            if (voiceMode && recognition) {
                                recognition.start();
                            }
                        }, 500);
                    }
                };
            } else {
                console.log('Speech recognition not supported');
                document.getElementById('voiceButton').style.display = 'none';
            }
        }
    </script>
</body>
</html>
